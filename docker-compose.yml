# Local Postgres for the schema-shape tests.
#
# The RLS tests must run against a real database — a mock cannot tell you
# whether a policy exists. This is the cheapest real one.
#
#   docker compose up -d
#   npm run db:reset
#   npm run test:rls
#
# It is not a Supabase stand-in: there is no `storage` schema and no GoTrue, so
# 0002_storage.sql no-ops here and `auth.uid()` comes from tests/rls/shims.sql.

services:
  db:
    image: postgres:17-alpine
    container_name: sala-db
    environment:
      POSTGRES_USER: sala
      POSTGRES_PASSWORD: sala
      POSTGRES_DB: sala
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sala -d sala']
      interval: 3s
      timeout: 3s
      retries: 20

  # DOCX → PDF for Document Templates (ADR 0017). Sala reaches it at
  # GOTENBERG_URL=http://localhost:3100; nothing else should.
  gotenberg:
    build: ./docker/gotenberg
    container_name: sala-gotenberg
    ports:
      - '127.0.0.1:3100:3000'
